name: CI and runtime scaffold

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_scaffold:
        description: Sync the prepared runtime files via SSH
        type: boolean
        default: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  container-images:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend runtime image
        run: docker build --file apps/frontend/Dockerfile --tag multiple-choice-frontend:ci .
      - name: Build backend runtime image
        run: docker build --file apps/backend/Dockerfile --tag multiple-choice-backend:ci .

  deploy-scaffold:
    runs-on: ubuntu-latest
    needs: container-images
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_scaffold }}
    environment: runtime
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Sync runtime scaffold
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy" deploy/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"
          rsync -az -e "ssh -i ~/.ssh/id_deploy" apps/backend/sql/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/sql/"
