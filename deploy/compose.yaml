name: multiple-choice

services:
  database:
    image: ${MARIADB_IMAGE:-mariadb:11.4}
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - database:/var/lib/mysql
      - ./sql/001-create-tables.sql:/docker-entrypoint-initdb.d/001-create-tables.sql:ro
      - ./sql/002-reset-content.sql:/docker-entrypoint-initdb.d/002-reset-content.sql:ro
      - ./sql/003-demo-data.sql:/docker-entrypoint-initdb.d/003-demo-data.sql:ro

  application:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      FRONTEND_DIRECTORY: /workspace/apps/frontend/dist
      OPENAPI_PATH: /workspace/packages/contracts/openapi.yaml
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:3000"

volumes:
  database:
