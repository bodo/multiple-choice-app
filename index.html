<!doctype html>
<html lang="en" data-theme="abschluss-light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>BITS - learn on the go</title>
  <script>
    (function() {
      var t = matchMedia('(prefers-color-scheme:dark)').matches
        ? 'abschluss-dark'
        : 'abschluss-light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
