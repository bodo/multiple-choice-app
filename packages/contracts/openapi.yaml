openapi: 3.0.3
info:
  title: Multiple Choice API
  version: 1.0.0
  description: Public exercise API demo. Authentication and learner sync follow later.
servers:
  - url: /
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Runtime health
      responses:
        "200":
          description: Backend is running.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /api/v1/exercises:
    get:
      operationId: listExercises
      summary: List all demo exercises
      description: Returns the normalized rows selected with `SELECT * FROM exercises`.
      responses:
        "200":
          description: Exercise rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseList"
        "500":
          description: Database or server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  schemas:
    ExerciseList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Exercise"
    Exercise:
      type: object
      required:
        - id
        - inputMode
        - mobileSolvable
        - learningLevel
        - difficulty
        - categories
        - specializations
        - instruction
        - images
        - answerOptions
        - matchOptions
        - correct
        - submitButton
        - caseSensitive
        - maximumStringDistance
        - explainInstruction
        - explainAnswerOptions
        - adminComment
        - adminTags
        - contentRevision
        - isActive
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          example: demo_ap1_001
        inputMode:
          type: string
          enum: [SINGLE_CHOICE, MULTIPLE_CHOICE, TEXT, NUMBER, MATCH]
        mobileSolvable:
          type: boolean
        learningLevel:
          type: integer
          minimum: 1
          maximum: 10
        difficulty:
          type: integer
          minimum: 1
          maximum: 5
        categories:
          type: array
          minItems: 1
          items:
            type: string
        specializations:
          type: array
          minItems: 1
          items:
            type: string
            enum: [FIAN, FISI, FIDP, FIDV]
        instruction:
          type: string
        images:
          type: array
          items:
            type: string
        answerOptions:
          type: array
          items:
            type: string
        matchOptions:
          type: array
          items:
            type: string
        correct:
          type: array
          minItems: 1
          items:
            oneOf:
              - type: number
              - type: string
        submitButton:
          type: boolean
        caseSensitive:
          type: boolean
        maximumStringDistance:
          type: integer
          minimum: 0
        explainInstruction:
          type: string
        explainAnswerOptions:
          type: array
          items:
            type: string
        distractorTypes:
          type: object
          additionalProperties:
            type: string
          description: Extensible mapping of option index to distractor strategy classification.
        distractorAnalysis:
          type: object
          additionalProperties:
            type: string
          description: Pedagogical rationale for why each distractor was constructed.
        adminComment:
          type: string
        adminTags:
          type: array
          items:
            type: string
        contentRevision:
          type: integer
          minimum: 1
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Problem:
      type: object
      required: [statusCode, error, message]
      properties:
        statusCode:
          type: integer
        error:
          type: string
        message:
          type: string
